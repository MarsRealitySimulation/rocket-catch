<!DOCTYPE html>
<html>

<head>
    <title>Rocket Catch</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>🚀 ROCKET CATCH 🚀</h1>

 <div class="top-bar">

    <h2 id="fuel">Fuel: 60%</h2>

    <h2 id="score">Score: 0</h2>

</div>

    <div id="game">

        <div id="rocket">🚀</div>

        <div id="object">⭐</div>
<div id="meteor">☄️</div>
   
   <div id="battery">🔋</div>
  <div id="blackHole">
    <div class="black-hole-core"></div>
</div>
    </div>

    <div class="controls">

<button id="restartButton">🔄 RESTART</button>

        <button id="leftButton">⬅️ LEFT</button>

        <button id="rightButton">RIGHT ➡️</button>

    </div>

   <audio id="collectSound" src="sounds/collectSound.mp3"></audio>
<audio id="blackHoleSound" src="sounds/blackHoleSound.mp3"></audio>
<audio id="meteorSound" src="sounds/meteorSound.mp3"></audio>
<audio id="explosionSound" src="sounds/explosionSound.mp3"></audio>
<audio id="gameOverSound" src="sounds/gameOverSound.mp3"></audio>
<audio id="winSound" src="sounds/winSound.mp3"></audio>

<script src="script.js"></script>

</body>

</html>
